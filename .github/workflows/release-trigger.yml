name: Trigger Release (manual)

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version (x.y.z); default: the current version without -SNAPSHOT'
        required: false
      next-version:
        description: 'Next development version (x.y.z-SNAPSHOT); default: next patch version'
        required: false

jobs:
  prepare_release:
    name: Prepare Release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
    # the CI token is needed (instead of the default GITHUB_TOKEN) so that pushing the tag triggers the release workflow
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_CI_TOKEN }}
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Configure Git user
      run: |
        git config user.email "contextmapper-ci@kapferer.ch"
        git config user.name "Context Mapper CI"
    - name: Install Graphviz
      run: sudo apt-get -y install graphviz
    - name: Gradle caches
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Determine versions
      run: |
        CURRENT=$(sed -n 's/^version=//p' gradle.properties)
        RELEASE="${RELEASE_INPUT:-${CURRENT%-SNAPSHOT}}"
        if ! [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid release version: $RELEASE"; exit 1
        fi
        if [ -z "$NEXT_INPUT" ]; then
          IFS=. read -r MAJOR MINOR PATCH <<< "$RELEASE"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT"
        else
          NEXT="$NEXT_INPUT"
        fi
        if ! [[ "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
          echo "Invalid next development version: $NEXT"; exit 1
        fi
        if git rev-parse -q --verify "refs/tags/v$RELEASE" > /dev/null; then
          echo "Tag v$RELEASE already exists"; exit 1
        fi
        echo "Releasing $RELEASE (current: $CURRENT, next: $NEXT)"
        echo "RELEASE=$RELEASE" >> $GITHUB_ENV
        echo "NEXT=$NEXT" >> $GITHUB_ENV
      env:
        RELEASE_INPUT: ${{ inputs.release-version }}
        NEXT_INPUT: ${{ inputs.next-version }}
    - name: Build release version
      run: |
        sed -i "s/^version=.*/version=$RELEASE/" gradle.properties
        chmod +x gradlew
        ./gradlew clean build
    - name: Commit and tag release, prepare next development iteration
      run: |
        git commit -am "Release v$RELEASE"
        git tag "v$RELEASE"
        sed -i "s/^version=.*/version=$NEXT/" gradle.properties
        git commit -am "Prepare next development iteration ($NEXT)"
        git push --atomic origin HEAD:master "v$RELEASE"
