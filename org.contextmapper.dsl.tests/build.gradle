dependencies {
	implementation project(':context-mapper-dsl')
	implementation group: 'org.contextmapper', name: 'context-map-generator', version: '1.2.1'
	implementation group: 'commons-io', name: 'commons-io', version: '2.22.0'
	implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.21.0'
	
	testImplementation "org.junit.jupiter:junit-jupiter-api"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation 'org.junit.jupiter:junit-jupiter-params'
	testImplementation "org.eclipse.xtext:org.eclipse.xtext.testing:${xtextVersion}"
	testImplementation "org.eclipse.xtext:org.eclipse.xtext.xbase.testing:${xtextVersion}"
}
test {
	useJUnitPlatform()
}
//this is an eclipse plugin project
eclipseClasspath.enabled=false
cleanEclipseClasspath.enabled=false

jacocoTestReport {
	sourceSets project(':context-mapper-dsl').sourceSets.main
	
	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}
}

check.dependsOn jacocoTestReport
